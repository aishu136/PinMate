# Claude settings. Credentials come from ANTHROPIC_API_KEY (or an ant auth login profile).
pinterest-agent.model=claude-opus-5
pinterest-agent.max-tokens=16000
# Effort for writing pins: low | medium | high | xhigh | max
pinterest-agent.effort=high
# Retry declined requests on the recommended fallback model (server-side, beta)
pinterest-agent.refusal-fallbacks=true
# Total generate passes, including retries when validation finds problems
pinterest-agent.max-attempts=2

# Destination URL reading (Claude web fetch tool)
pinterest-agent.fetch.enabled=true
pinterest-agent.fetch.effort=low
pinterest-agent.fetch.max-content-tokens=20000

# Pinterest publishing. The access token comes from the PINTEREST_ACCESS_TOKEN env var (scopes:
# boards:read, pins:read, pins:write). Apps with trial access: use https://api-sandbox.pinterest.com/v5
quarkus.rest-client.pinterest.url=https://api.pinterest.com/v5
quarkus.rest-client.pinterest.connect-timeout=5000
quarkus.rest-client.pinterest.read-timeout=30000
# Tests talk to a fake Pinterest server in the test sources
%test.quarkus.rest-client.pinterest.url=http://localhost:${quarkus.http.test-port:8081}/fake-pinterest/v5
%test.pinterest.access-token=test-token

# Scheduled pins are stored in an embedded H2 database under ./data. Point quarkus.datasource.* at
# another database (e.g. PostgreSQL, after adding its JDBC driver) for production.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/pinmate
quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:pinmate;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# How often due pins are published, and how many tries a pin gets when Pinterest is unreachable or busy
pinmate.schedule.poll-interval=30s
pinmate.schedule.max-attempts=3
# Tests call the publisher directly instead of waiting for the timer
%test.quarkus.scheduler.enabled=false
